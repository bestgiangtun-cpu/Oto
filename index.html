<!doctype html>
<html lang="vi">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test 3 relay ESP32</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111a20;color:#f1f6f7;font:16px system-ui,sans-serif}main{max-width:850px;margin:auto;padding:clamp(24px,6vw,68px) 20px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}h1{font-size:clamp(28px,5vw,44px);margin:0;letter-spacing:-.045em}h2{margin:0 0 10px;font-size:18px}.panel,article{background:#1b2831;border:1px solid #344752;border-radius:14px;padding:20px}.status{border:1px solid #546771;border-radius:999px;padding:6px 12px;color:#c6d5da}.status.ready{color:#85efc3;border-color:#528971}form,.channels{display:grid;gap:12px;grid-template-columns:repeat(3,1fr)}form{align-items:end}.channels{margin:18px 0}label{display:grid;gap:5px}input,button{font:inherit;border-radius:8px;padding:10px 12px;width:100%}input{color:inherit;background:#111a20;border:1px solid #58707c}button{border:0;background:#9aebcc;color:#0d241b;font-weight:700;cursor:pointer;min-height:44px}button:disabled{background:#354650;color:#b4c1c9;cursor:default}article p,small{color:#bfcdd4}article button{margin-top:5px}article:nth-child(2) button:not(:disabled){background:#ffd596}.details{overflow-wrap:anywhere;display:block;margin-top:12px}ol{padding-left:24px;margin:8px 0 0;max-height:230px;overflow:auto}li{padding:4px 0;overflow-wrap:anywhere}@media(max-width:600px){form,.channels{grid-template-columns:1fr}}
</style>
<main>
<header><h1>Test 3 relay ESP32</h1><span id="status" class="status" role="status">Chưa kết nối MQTT</span></header>
<section class="panel" aria-labelledby="connection">
<h2 id="connection">Kết nối EMQX</h2>
<form id="connect">
<label>Tên người dùng MQTT<input id="user" required autocomplete="username"></label>
<label>Mật khẩu MQTT<input id="pass" required type="password" autocomplete="current-password"></label>
<button id="connect-button" type="submit">Kết nối</button>
</form>
<small class="details">Máy chủ EMQX · WSS 8084 · oto/dieukhien</small>
</section>
<section class="channels" aria-label="Điều khiển relay">
<article><h2>Nguồn</h2><p>GPIO21 · Kích LOW</p><button disabled data-command="TOGGLE_IGNITION">Bật / tắt nguồn</button></article>
<article><h2>Đề</h2><p>GPIO22 · Kích HIGH · Khoảng 1,5 giây</p><button disabled data-command="START_ENGINE">Kích đề</button></article>
<article><h2>Máy lạnh</h2><p>GPIO23 · Kích HIGH</p><button disabled data-command="TOGGLE_AC">Bật / tắt máy lạnh</button></article>
</section>
<section class="panel" aria-labelledby="events"><h2 id="events">Nhật ký</h2><ol id="log" aria-live="polite"><li>Chờ kết nối EMQX.</li></ol></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.14.1/dist/mqtt.min.js"></script>
<script>
'use strict';
const broker = 'wss://gd061a36.ala.asia-southeast1.emqxsl.com:8084/mqtt';
const controlTopic = 'oto/dieukhien';
const statusTopic = 'oto/trangthai';
const form = document.querySelector('#connect');
const username = document.querySelector('#user');
const password = document.querySelector('#pass');
const connectButton = document.querySelector('#connect-button');
const status = document.querySelector('#status');
const log = document.querySelector('#log');
const controls = [...document.querySelectorAll('[data-command]')];
let client;

function addLog(message) {
  const item = document.createElement('li');
  item.textContent = new Date().toLocaleTimeString('vi-VN') + ' · ' + message;
  log.prepend(item);
  if (log.children.length > 30) log.lastElementChild.remove();
}

function connectionState(message, ready = false) {
  status.textContent = message;
  status.classList.toggle('ready', ready);
  controls.forEach(button => { button.disabled = !ready; });
}

form.addEventListener('submit', event => {
  event.preventDefault();
  if (client) {
    const current = client;
    client = undefined;
    current.end(true);
    connectionState('Đã ngắt MQTT');
    connectButton.textContent = 'Kết nối';
    return;
  }
  if (!window.mqtt) {
    addLog('Không tải được thư viện MQTT. Kiểm tra Internet và tải lại trang.');
    return;
  }

  connectionState('Đang kết nối MQTT');
  const connection = mqtt.connect(broker, {
    username: username.value,
    password: password.value,
    protocolVersion: 4,
    clean: true,
    reconnectPeriod: 0,
    connectTimeout: 8000
  });
  client = connection;
  connectButton.textContent = 'Ngắt kết nối';

  connection.on('connect', () => {
    if (client !== connection) return;
    connection.subscribe(statusTopic, { qos: 0 }, (error, granted) => {
      if (client !== connection) return;
      if (error || granted?.[0]?.qos !== 0) {
        addLog('Broker từ chối đăng ký nhận trạng thái ESP32.');
        connection.end(true);
        return;
      }
      connectionState('Đã kết nối MQTT', true);
      addLog('Đã kết nối broker. Bấm một nút để thử và xem phản hồi từ ESP32.');
    });
  });
  connection.on('message', (topic, payload) => {
    if (client === connection && topic === statusTopic) addLog('ESP32 · ' + payload.toString());
  });
  connection.on('error', error => {
    if (client === connection) addLog('Lỗi MQTT · ' + error.message);
  });
  connection.on('close', () => {
    if (client !== connection) return;
    client = undefined;
    connectionState('MQTT đã ngắt');
    connectButton.textContent = 'Kết nối';
    addLog('Đã đóng kết nối với broker.');
  });
});

controls.forEach(button => button.addEventListener('click', () => {
  if (!client?.connected || button.disabled) return;
  const command = button.dataset.command;
  client.publish(controlTopic, command, { qos: 0, retain: false }, error => {
    addLog(error ? 'Lỗi gửi lệnh · ' + error.message : 'Đã gửi ' + command + ' · Chờ phản hồi ESP32');
  });
}));
</script>
</html>
